<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Cloud Lab · Control panel</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <div class="brand">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2.5 3.5 7v10L12 21.5 20.5 17V7L12 2.5Z" fill="#fff"/><path d="M3.5 7 12 11.5 20.5 7M12 11.5v10" fill="none" stroke="#1f5ae0" stroke-width="1.4" stroke-linejoin="round"/></svg>
      <span>AI Cloud Lab</span>
    </div>
    <div class="topsearch" role="search">
      <svg class="icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="#fff" stroke-width="1.8"/><path d="m15.2 15.2 5 5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="global-search" type="search" placeholder="Search this page" aria-label="Search this page" autocomplete="off">
      <kbd aria-hidden="true">Ctrl+K</kbd>
    </div>
    <div id="userchip" class="userchip" role="group" aria-label="Not signed in"></div>
  </header>

  <div class="demo" role="region" aria-label="Demo controls">
    <strong>MOCK DATA</strong>
    <span>Nothing here talks to AWS.</span>
    <label>Sign in as <select id="demo-user"></select></label>
    <label>Auto-stop view <select id="demo-scenario">
      <option value="normal">Normal</option>
      <option value="off">Auto-stop is off</option>
      <option value="silent">Idle monitor silent</option>
      <option value="unknown">Activity unknown</option>
    </select></label>
    <button id="demo-advance" type="button">Move clock +10 min</button>
    <button id="demo-reset" type="button">Reset demo</button>
  </div>

  <div class="shell">
    <nav class="sidebar" aria-label="Main">
      <ul class="nav" id="nav"></ul>
    </nav>
    <main id="main" class="main" tabindex="-1">
      <noscript><p>This page needs JavaScript.</p></noscript>
    </main>
  </div>

  <footer class="statusbar">
    <div class="status-ok"><span class="dot" aria-hidden="true"></span><span>Control API connected (mock)</span></div>
    <div>Region us-east-1</div>
    <div class="push"><span id="last-updated">Not loaded yet</span><span>Mock v0.1</span></div>
  </footer>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <script src="mock-api.js"></script>
  <script src="app.js"></script>
</body>
</html>
